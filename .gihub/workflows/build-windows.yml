name: Windows-Installer bauen und veröffentlichen

# Läuft automatisch bei jedem Upload/Änderung, UND lässt sich manuell über
# den "Actions"-Tab auf GitHub per Klick starten ("Run workflow").
#
# WICHTIG für Updates: Jedes Mal, wenn ihr eine neue Version verteilen wollt,
# zuerst die Versionsnummer in src-tauri/tauri.conf.json ("version": "0.4.0")
# UND in frontend/package.json UND src-tauri/Cargo.toml erhöhen, dann
# hochladen. Die Versionsnummer entscheidet, ob installierte Apps ein Update
# angeboten bekommen.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# Erlaubt dem Workflow, auf GitHub tatsächlich einen Release anzulegen und
# Dateien hochzuladen (ohne das: "Resource not accessible by integration").
permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Abhängigkeiten cachen (macht spätere Läufe schneller)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend-Abhängigkeiten installieren
        working-directory: frontend
        run: npm install

      - name: Tauri-CLI installieren
        run: cargo install tauri-cli --version "^2" --locked

      # Lädt die Schriftarten (Michroma, Inter) einmalig herunter und legt sie
      # FEST in die App - dadurch braucht die fertige App später KEIN Internet
      # mehr, um die Schrift anzuzeigen (wichtig auf dem Rechner des
      # Rennkommissars, falls dort kein zuverlässiges Internet vorhanden ist).
      - name: Schriftarten für Offline-Nutzung herunterladen
        shell: pwsh
        run: |
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          $cssUrl = "https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@300;400;500;600&display=swap"
          $css = (Invoke-WebRequest -Uri $cssUrl -Headers @{ "User-Agent" = $ua }).Content
          New-Item -ItemType Directory -Force -Path "frontend/public/fonts" | Out-Null
          $fontMatches = [regex]::Matches($css, 'url\((https://fonts\.gstatic\.com/[^)]+)\)')
          $counter = 0
          foreach ($m in $fontMatches) {
            $url = $m.Groups[1].Value
            $counter++
            $ext = [System.IO.Path]::GetExtension($url.Split('?')[0])
            $filename = "font-$counter$ext"
            Invoke-WebRequest -Uri $url -OutFile "frontend/public/fonts/$filename"
            $css = $css.Replace($url, "/fonts/$filename")
          }
          Set-Content -Path "frontend/src/fonts.css" -Value $css -Encoding UTF8
          Write-Host "Schriftarten heruntergeladen: $counter Dateien"

      # Erzeugt alle Icon-Formate (.ico, .icns, PNG-Größen) automatisch aus
      # einer einzigen Bilddatei. Um das App-Icon zu ändern: einfach
      # src-tauri/icons/icon-source.png durch ein neues quadratisches PNG
      # (mind. 512x512px) ersetzen und neu hochladen - der Rest passiert hier
      # automatisch.
      - name: App-Icons aus icon-source.png erzeugen
        working-directory: src-tauri
        run: cargo tauri icon icons/icon-source.png

      # Baut den Installer, signiert ihn für den Auto-Updater, erstellt/
      # aktualisiert automatisch einen versionierten GitHub-Release (z.B.
      # "v0.4.0") und lädt sowohl den Installer als auch die für den
      # Auto-Updater nötige latest.json dorthin hoch. Das ist der einzige
      # dauerhafte Download-Link, den ihr braucht.
      - name: Installer bauen, signieren und veröffentlichen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "LMU RACECONTROL v__VERSION__"
          releaseBody: "Automatisch gebaute Version. Die passende Installationsdatei unten herunterladen."
          releaseDraft: false
          prerelease: false