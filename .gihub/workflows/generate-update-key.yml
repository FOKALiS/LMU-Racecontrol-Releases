name: (Einmalig) Update-Signierschlüssel erzeugen

# Nur manuell über den "Actions"-Tab startbar ("Run workflow") - erzeugt
# EINMALIG das Schlüsselpaar, mit dem alle zukünftigen Updates signiert
# werden. Nach dem Ausführen: Ergebnis im Log ablesen (siehe
# ANLEITUNG-INSTALLER-BEKOMMEN.md, Abschnitt "Auto-Update einrichten").
on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: windows-latest
    steps:
      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Tauri-CLI installieren
        run: cargo install tauri-cli --version "^2" --locked

      - name: Schlüsselpaar erzeugen und im Log anzeigen
        shell: pwsh
        run: |
          cargo tauri signer generate -w update-key.key -p "" --force --ci
          Write-Host ""
          Write-Host "================================================================"
          Write-Host "OEFFENTLICHER SCHLUESSEL - in src-tauri/tauri.conf.json bei"
          Write-Host "plugins.updater.pubkey einfuegen (den Platzhaltertext ersetzen):"
          Write-Host "================================================================"
          Get-Content update-key.key.pub
          Write-Host ""
          Write-Host "================================================================"
          Write-Host "PRIVATER SCHLUESSEL - als GitHub-Secret mit dem Namen"
          Write-Host "TAURI_SIGNING_PRIVATE_KEY speichern (Repository-Einstellungen ->"
          Write-Host "Secrets and variables -> Actions -> New repository secret)."
          Write-Host "NIEMALS in den Code oder ins Repository einfuegen!"
          Write-Host "================================================================"
          Get-Content update-key.key
          Write-Host ""
          Write-Host "Ein zweites Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD anlegen,"
          Write-Host "Wert: leer lassen (keinen Wert eingeben, Secret trotzdem anlegen)"