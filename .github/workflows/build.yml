name: Build Tauri App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Build Tauri app
        run: cargo tauri build
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: LMU-RACECONTROL-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: LMU-RACECONTROL-MSI
          path: src-tauri/target/release/bundle/msi/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: LMU-RACECONTROL-NSIS
          path: installer

      - name: Download MSI installer
        uses: actions/download-artifact@v4
        with:
          name: LMU-RACECONTROL-MSI
          path: installer

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: LMU RACECONTROL ${{ github.ref_name }}
          body: "Automatisch erstellter Release – siehe CHANGELOG.md für Details."
          draft: false
          prerelease: false
          files: |
            installer/*.exe
            installer/*.msi
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}