name: Discord Release Notification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to use for the notification (e.g. v0.9.5)'
        required: true
        type: string
        default: 'v0.9.5'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NAME: ${{ github.event.release.name }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ No Discord webhook configured (DISCORD_RELEASE_WEBHOOK)"
            exit 0
          fi

          # Bei workflow_dispatch den manuell eingegebenen Tag verwenden, sonst vom Release-Event
          if [ -n "${{ inputs.tag }}" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi
          VERSION="${RELEASE_TAG#v}"

          # Changelog parsen – den Abschnitt für diese Version extrahieren
          MATCH=$(awk -v ver="[$VERSION]" '
            /^## / {found=0}
            index($0, "## " ver) == 1 {found=1}
            found {print}
          ' CHANGELOG.md)

          DESCRIPTION=""
          CURRENT_SECTION=""

          if [ -n "$MATCH" ]; then
            while IFS= read -r line; do
              # Deutsche Sektionstitel auf Emoji-Englisch mappen
              if [[ "$line" =~ ^###\ Hinzugefügt ]]; then
                CURRENT_SECTION="added"
                DESCRIPTION+="✨ **Added**\n"
              elif [[ "$line" =~ ^###\ Geändert ]]; then
                CURRENT_SECTION="changed"
                DESCRIPTION+="🔧 **Changed**\n"
              elif [[ "$line" =~ ^###\ Behoben ]]; then
                CURRENT_SECTION="fixed"
                DESCRIPTION+="🛠️ **Fixed**\n"
              elif [[ "$line" =~ ^###\ Neu ]]; then
                CURRENT_SECTION="added"
                DESCRIPTION+="✨ **Added**\n"
              elif [[ "$line" =~ ^###\ Technisch ]]; then
                CURRENT_SECTION="technical"
                DESCRIPTION+="⚙️ **Technical**\n"
              elif [[ "$line" =~ ^###\ Quelle ]]; then
                CURRENT_SECTION=""
              elif [[ "$line" =~ ^###\ Wichtig ]]; then
                CURRENT_SECTION=""
              elif [[ "$line" =~ ^###\ Bekannt ]]; then
                CURRENT_SECTION=""
              elif [[ "$line" =~ ^-\ (.+) ]]; then
                ITEM="${BASH_REMATCH[1]}"
                if [ -n "$CURRENT_SECTION" ]; then
                  DESCRIPTION+="$ITEM\n"
                fi
              fi
            done <<< "$MATCH"
          fi

          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="See the release notes on GitHub for details."
          fi

          # Versuch 1: Mit @everyone
          JSON=$(cat <<EOF
          {
            "content": "@everyone",
            "embeds": [{
              "title": "🚀 LMU RACECONTROL v${VERSION} is out!",
              "url": "$RELEASE_URL",
              "color": 5242880,
              "description": "$DESCRIPTION",
              "footer": {
                "text": "LMU RACECONTROL – Das Tool für Rennkommissare"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }
          EOF
          )

          echo "Sending to Discord with @everyone..."
          RESPONSE=$(curl -sS -f -X POST -H "Content-Type: application/json" -d "$JSON" "$DISCORD_WEBHOOK" 2>&1)
          if [ $? -ne 0 ]; then
            echo "⚠️ Failed with @everyone, retrying without mention..."
            
            # Versuch 2: Ohne @everyone (falls Webhook keine @everyone-Berechtigung hat)
            JSON=$(cat <<EOF
            {
              "embeds": [{
                "title": "🚀 LMU RACECONTROL v${VERSION} is out!",
                "url": "$RELEASE_URL",
                "color": 5242880,
                "description": "@everyone\n\n$DESCRIPTION",
                "footer": {
                  "text": "LMU RACECONTROL – Das Tool für Rennkommissare"
                },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
              }]
            }
            EOF
            )

            RESPONSE=$(curl -sS -f -X POST -H "Content-Type: application/json" -d "$JSON" "$DISCORD_WEBHOOK" 2>&1)
            if [ $? -ne 0 ]; then
              echo "❌ Discord API error: $RESPONSE"
              exit 1
            fi
          fi
          echo "✅ Discord notification sent"
