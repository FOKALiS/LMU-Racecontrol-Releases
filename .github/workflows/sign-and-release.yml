name: Sign & Release

on:
  release:
    types: [published]

jobs:
  sign-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to upload .sig + update release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download EXE from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📥 Downloading EXE from release ${{ github.event.release.tag_name }} ..."
          # Find the .exe asset in the release
          ASSET_URL=$(gh release view "${{ github.event.release.tag_name }}" --json assets --jq '.assets[] | select(.name | endswith(".exe")) | .url' | head -1)
          if [ -z "$ASSET_URL" ]; then
            echo "❌ No .exe asset found in release!"
            echo "   Please upload the EXE to the release first, then re-publish."
            exit 1
          fi
          echo "   Found: $ASSET_URL"
          gh release download "${{ github.event.release.tag_name }}" --pattern "*.exe" --dir /tmp
          echo "✅ EXE downloaded"

      - name: Install Tauri CLI (for signer)
        run: |
          echo "📦 Installing Tauri CLI..."
          npm install -g @tauri-apps/cli@latest 2>&1
          echo "✅ Tauri CLI installed"

      - name: Sign the EXE
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "🔐 Signing EXE ..."
          ls -la /tmp/
          EXE_FILE=$(ls /tmp/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE_FILE" ]; then
            echo "❌ No .exe file found in /tmp"
            exit 1
          fi
          echo "   File: $EXE_FILE"
          
          # Key mit printf (kein extra Newline) in Datei schreiben
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/private_key.txt
          KEY_LEN=$(wc -c < /tmp/private_key.txt)
          echo "   Key file length: $KEY_LEN bytes"
          echo "   Key start: $(head -c 40 /tmp/private_key.txt)..."
          
          # Prüfen ob Base64 (alphanumerisch + +/ =)
          if grep -qE '^[A-Za-z0-9+/=]+$' /tmp/private_key.txt; then
            echo "   ✅ Key is valid base64"
          else
            echo "   ⚠️ Key contains non-base64 chars – stripping whitespace"
            # Whitespace entfernen und neu schreiben
            tr -d '\n\r\t ' < /tmp/private_key.txt > /tmp/private_key_clean.txt
            mv /tmp/private_key_clean.txt /tmp/private_key.txt
            echo "   Cleaned: $(wc -c < /tmp/private_key.txt) bytes"
          fi
          
          # Sign with key file (robustester Weg)
          npx tauri signer sign \
            --private-key /tmp/private_key.txt \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$EXE_FILE" 2>&1
          
          SIG_FILE="${EXE_FILE}.sig"
          if [ -f "$SIG_FILE" ]; then
            echo "✅ Signed: $(basename $SIG_FILE)"
            echo "   Signature start: $(head -c 40 $SIG_FILE)..."
            rm -f /tmp/private_key.txt
            exit 0
          fi
          
          # Fallback 1: cargo tauri signer
          echo "❌ npm signer failed – trying cargo..."
          cargo install tauri-cli --version "^2" --locked 2>&1
          cargo tauri signer sign \
            --private-key /tmp/private_key.txt \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$EXE_FILE" 2>&1
          
          SIG_FILE="${EXE_FILE}.sig"
          if [ -f "$SIG_FILE" ]; then
            echo "✅ Signed via cargo: $(basename $SIG_FILE)"
            rm -f /tmp/private_key.txt
            exit 0
          fi
          
          # Fallback 2: direkter Base64-String (ohne Datei)
          echo "❌ cargo signer failed – trying direct base64 string..."
          KEY_STRING=$(cat /tmp/private_key.txt)
          npx tauri signer sign \
            --private-key "$KEY_STRING" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$EXE_FILE" 2>&1
          
          rm -f /tmp/private_key.txt
          
          SIG_FILE="${EXE_FILE}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "❌ All signing methods failed – no .sig file created"
            exit 1
          fi
          echo "✅ Signed: $(basename $SIG_FILE)"

      - name: Upload .sig to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📤 Uploading .sig to release ..."
          SIG_FILE=$(ls /tmp/*.exe.sig | head -1)
          gh release upload "${{ github.event.release.tag_name }}" "$SIG_FILE" --clobber
          echo "✅ .sig uploaded"

      - name: Extract signature for latest.json
        run: |
          SIG_FILE=$(ls /tmp/*.exe.sig | head -1)
          SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
          echo "SIGNATURE=$SIGNATURE" >> $GITHUB_ENV
          echo "   Signature: ${SIGNATURE:0:40}..."

      - name: Update latest.json
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION_NO_V="${VERSION#v}"
          EXE_NAME="LMU.RACECONTROL_${VERSION_NO_V}_x64-setup.exe"
          DOWNLOAD_URL="https://github.com/FOKALiS/LMU-Racecontrol-Releases/releases/latest/download/${EXE_NAME}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S+00:00")
          
          # Extract changelog notes for this version
          NOTES=$(awk -v ver="[$VERSION_NO_V]" '
            /^## / {found=0}
            index($0, "## " ver) == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md | head -20)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          NOTES=$(echo "$NOTES" | tr '\n' ' ' | sed 's/  */ /g')
          
          # Write latest.json
          cat > /tmp/latest.json << 'JSONEOF'
          {
            "version": "VERSION_PLACEHOLDER",
            "notes": "NOTES_PLACEHOLDER",
            "pub_date": "DATE_PLACEHOLDER",
            "platforms": {
              "windows-x86_64": {
                "signature": "SIGNATURE_PLACEHOLDER",
                "url": "URL_PLACEHOLDER"
              }
            }
          }
          JSONEOF
          
          # Replace placeholders using jq
          jq --arg v "$VERSION_NO_V" \
             --arg n "$NOTES" \
             --arg d "$PUB_DATE" \
             --arg s "$SIGNATURE" \
             --arg u "$DOWNLOAD_URL" \
             '.version = $v | .notes = $n | .pub_date = $d | .platforms["windows-x86_64"].signature = $s | .platforms["windows-x86_64"].url = $u' \
             /tmp/latest.json > latest.json
          
          echo "✅ latest.json updated"
          cat latest.json | head -5

      - name: Commit and push latest.json
        run: |
          git config user.name "Release Bot"
          git config user.email "bot@lmu-racecontrol.com"
          git add latest.json
          git diff --cached --quiet || {
            git commit -m "Update latest.json for ${{ github.event.release.tag_name }}"
            git push origin main
            echo "✅ latest.json committed and pushed"
          }
          if [ $? -eq 0 ]; then
            echo "ℹ️  No changes to latest.json"
          fi

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          
          # Changelog für diese Version extrahieren
          MATCH=$(awk -v ver="[$VERSION]" '
            /^## / {found=0}
            index($0, "## " ver) == 1 {found=1}
            found {print}
          ' CHANGELOG.md)
          
          DESCRIPTION=""
          CURRENT_SECTION=""
          FIRST_SECTION=true
          
          if [ -n "$MATCH" ]; then
            while IFS= read -r line; do
              if [[ "$line" =~ ^###\ Added ]]; then
                [ "$FIRST_SECTION" = false ] && DESCRIPTION+="\n"
                CURRENT_SECTION="added"; DESCRIPTION+="## ✨ Added\n"; FIRST_SECTION=false
              elif [[ "$line" =~ ^###\ Changed ]]; then
                [ "$FIRST_SECTION" = false ] && DESCRIPTION+="\n"
                CURRENT_SECTION="changed"; DESCRIPTION+="## 🔧 Changed\n"; FIRST_SECTION=false
              elif [[ "$line" =~ ^###\ Fixed ]]; then
                [ "$FIRST_SECTION" = false ] && DESCRIPTION+="\n"
                CURRENT_SECTION="fixed"; DESCRIPTION+="## 🛠️ Fixed\n"; FIRST_SECTION=false
              elif [[ "$line" =~ ^###\ Technical ]]; then
                [ "$FIRST_SECTION" = false ] && DESCRIPTION+="\n"
                CURRENT_SECTION="technical"; DESCRIPTION+="## ⚙️ Technical\n"; FIRST_SECTION=false
              elif [[ "$line" =~ ^###\ (Source|Important|Known) ]]; then
                CURRENT_SECTION=""
              elif [[ "$line" =~ ^-\ (.+) ]]; then
                [ -n "$CURRENT_SECTION" ] && DESCRIPTION+="• ${BASH_REMATCH[1]}\n"
              fi
            done <<< "$MATCH"
          fi
          
          [ -z "$DESCRIPTION" ] && DESCRIPTION="See the release notes on GitHub for details."
          
          # Nachricht OHNE Link
          FULL_MESSAGE="@everyone\n🚀 **LMU RACECONTROL v${VERSION} is out!**\n\n${DESCRIPTION}\n\n─\nLMU RACECONTROL – The tool for race stewards"
          FULL_MESSAGE=$(echo -e "$FULL_MESSAGE")
          
          # Senden
          MAX_LEN=1900
          while [ -n "$FULL_MESSAGE" ]; do
            CHUNK="${FULL_MESSAGE:0:$MAX_LEN}"
            if [ ${#FULL_MESSAGE} -gt $MAX_LEN ]; then
              LAST_NEWLINE=$(echo "${CHUNK}" | awk 'END{print length-1}')
              [ "$LAST_NEWLINE" -gt 0 ] && CHUNK="${FULL_MESSAGE:0:$LAST_NEWLINE}"
            fi
            JSON=$(jq -n --arg content "$CHUNK" '{content: $content}')
            curl -sS -f -X POST -H "Content-Type: application/json" -d "$JSON" "$DISCORD_WEBHOOK" || {
              echo "❌ Discord API error"
              exit 1
            }
            FULL_MESSAGE="${FULL_MESSAGE:${#CHUNK}}"
          done
          echo "✅ Discord notification sent (no link)"
