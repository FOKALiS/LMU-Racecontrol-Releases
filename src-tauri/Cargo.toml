[package]
name = "lmu-race-control"
version = "0.9.5"
description = "LIVE Rennkommission Tool für Le Mans Ultimate – Vorfallserkennung und -dokumentation"
authors = ["Your Race Control Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"

# HTTP-Client für die offizielle LMU REST-API (localhost:6397)
once_cell = "1"
reqwest = { version = "0.12", features = ["json"] }

# WebSocket-Client für LMU Replay-Metrics (ws://localhost:6398/websocket/replaymetrics)
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Auto-Update-Funktion
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[[bin]]
name = "lmu-race-control"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
