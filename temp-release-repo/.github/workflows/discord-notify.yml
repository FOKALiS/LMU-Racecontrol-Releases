name: Discord Release Notification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.9.5)'
        required: true
        default: 'v0.9.5'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NAME: ${{ github.event.release.name }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ No Discord webhook configured (DISCORD_RELEASE_WEBHOOK)"
            exit 0
          fi

          VERSION="${RELEASE_TAG#v}"

          # Parse changelog section for this version
          CHANGELOG=$(cat CHANGELOG.md)
          SECTION=$(echo "$CHANGELOG" | awk "/^## \\[$VERSION\\]/,/^## \\[/" | head -n -1)

          # Build description
          DESCRIPTION=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^###\ (.+) ]]; then
              HEADER="${BASH_REMATCH[1]}"
              case "$HEADER" in
                "Hinzugefügt"|"Added"|"Neu"|"New")
                  DESCRIPTION+=":sparkles: **Added**\n" ;;
                "Geändert"|"Changed")
                  DESCRIPTION+=":wrench: **Changed**\n" ;;
                "Behoben"|"Fixed"|"Bug Fixes"|"Fixes")
                  DESCRIPTION+=":bug: **Fixed**\n" ;;
                "Technisch"|"Technical"|"Technical Details")
                  DESCRIPTION+=":gear: **Technical**\n" ;;
                *)
                  DESCRIPTION+="**$HEADER**\n" ;;
              esac
            elif [[ "$line" =~ ^-\ \*\*(.+)\*\*:\ (.*) ]]; then
              ITEM="${BASH_REMATCH[1]}"
              DETAIL="${BASH_REMATCH[2]}"
              DESCRIPTION+="• **${ITEM}**: ${DETAIL}\n"
            elif [[ "$line" =~ ^-\ (.+) ]]; then
              ITEM="${BASH_REMATCH[1]}"
              DESCRIPTION+="• ${ITEM}\n"
            fi
          done <<< "$SECTION"

          # Fallback if no changelog entry found
          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="See release notes on GitHub for details."
          fi

          # Truncate to max 2048 chars (Discord limit)
          if [ ${#DESCRIPTION} -gt 2000 ]; then
            DESCRIPTION="${DESCRIPTION:0:1997}..."
          fi

          # Build Discord embed with @everyone ping
          JSON=$(cat <<EOF
          {
            "content": "@everyone",
            "embeds": [{
              "title": "🚀 **LMU RACECONTROL $RELEASE_TAG**",
              "url": "$RELEASE_URL",
              "color": 10027008,
              "thumbnail": {
                "url": "https://raw.githubusercontent.com/FOKALiS/LMU-Racecontrol-Releases/main/lmu-rc-logo.png"
              },
              "description": "$DESCRIPTION",
              "fields": [
                {
                  "name": ":inbox_tray: **Download**",
                  "value": "• [Download Installer]($RELEASE_URL)\n• [View all releases](https://github.com/FOKALiS/LMU-Racecontrol-Releases/releases)",
                  "inline": false
                }
              ],
              "footer": {
                "text": "LMU RACECONTROL – Race Control Tool for Le Mans Ultimate",
                "icon_url": "https://raw.githubusercontent.com/FOKALiS/LMU-Racecontrol-Releases/main/lmu-rc-logo.png"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -d "$JSON" "$DISCORD_WEBHOOK"
          echo "✅ Discord notification sent"